
<!DOCTYPE html>
<html>
<head>
<title>Academic Data</title>
<style>
body{font-family:Arial;background:#eef2ff;padding:25px}
.card{max-width:450px;margin:auto;background:white;padding:25px;border-radius:15px;box-shadow:0 4px 15px #ccc}
h2{color:#4938a8}
input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
button{background:#4938a8;color:white;border:0;border-radius:8px;cursor:pointer}
#result{white-space:pre-line;margin-top:15px}
</style>
</head>
<body>
<div class="card">
<h2>Academic Performance</h2>
<input id="name" placeholder="Student Name">
<input id="cgpa" type="number" min="0" max="10" step="0.01" placeholder="CGPA (0-10)">
<input id="marks" type="number" min="0" max="100" placeholder="Marks (%)">
<input id="backlogs" type="number" min="0" step="1" placeholder="Number of Backlogs">
<button onclick="show()">View Academic Data</button>
<div id="result"></div>
</div>
<script>
function show(){
let n=document.getElementById("name").value.trim();
let c=document.getElementById("cgpa").value;
let m=document.getElementById("marks").value;
let b=document.getElementById("backlogs").value;
if(!n||c===""||m===""||b===""||+c<0||+c>10||+m<0||+m>100||!Number.isInteger(+b)||+b<0){
document.getElementById("result").textContent="Enter valid details.";
return;
}
document.getElementById("result").textContent=
"Student: "+n+"\nCGPA: "+c+"/10\nMarks: "+m+"%\nBacklogs: "+b;
}
</script>
</body>
</html>
