
<!DOCTYPE html>
<html>
<head>
<title>Student Feedback</title>
<style>
body{font-family:Arial;background:#fff0f0;padding:25px}
.card{max-width:450px;margin:auto;background:white;padding:25px;border-radius:15px}
h2{color:#c13c55}
input,select,textarea,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
button{background:#c13c55;color:white;border:0;border-radius:8px;cursor:pointer}
textarea{min-height:85px}
#result{white-space:pre-line;margin-top:15px}
</style>
</head>
<body>
<div class="card">
<h2>Student Feedback</h2>
<input id="name" placeholder="Student Name">
<label for="satisfaction">Student Satisfaction (1-10)</label>
<input id="satisfaction" type="number" min="1" max="10" placeholder="Enter rating">
<label for="faculty">Faculty Feedback</label>
<select id="faculty">
<option value="">Select feedback</option>
<option>Excellent</option>
<option>Good</option>
<option>Satisfactory</option>
<option>Needs Improvement</option>
</select>
<textarea id="comments" placeholder="Additional comments (optional)"></textarea>
<button onclick="show()">View Feedback</button>
<div id="result"></div>
</div>
<script>
function show(){
let n=document.getElementById("name").value.trim();
let s=document.getElementById("satisfaction").value;
let f=document.getElementById("faculty").value;
let c=document.getElementById("comments").value.trim();
let r=document.getElementById("result");
if(!n||s===""||+s<1||+s>10||!f){
r.textContent="Please complete the required fields.";
return;
}
r.textContent="Student: "+n+"\nSatisfaction: "+s+"/10\nFaculty Feedback: "+f+"\nComments: "+(c||"No additional comments");
}
</script>
</body>
</html>
