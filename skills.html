
<!DOCTYPE html>
<html>
<head>
<title>Student Skills</title>
<style>
body{font-family:Arial;background:#eafff0;padding:25px}
.card{max-width:450px;margin:auto;background:white;padding:25px;border-radius:15px}
h2{color:#168344}
input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
button{background:#168344;color:white;border:0;border-radius:8px}
#result{white-space:pre-line;margin-top:15px}
</style>
</head>
<body>
<div class="card">
<h2>Skills Assessment</h2>
<input id="name" placeholder="Student Name">
<input id="technical" type="number" min="1" max="10" placeholder="Technical Skills (1-10)">
<input id="soft" type="number" min="1" max="10" placeholder="Soft Skills (1-10)">
<button onclick="show()">View Skills</button>
<div id="result"></div>
</div>
<script>
function show(){
let n=document.getElementById("name").value.trim();
let t=document.getElementById("technical").value;
let s=document.getElementById("soft").value;
let r=document.getElementById("result");
if(!n||t===""||s===""||+t<1||+t>10||+s<1||+s>10){
r.textContent="Enter valid skill ratings.";
return;
}
r.textContent="Student: "+n+"\nTechnical Skills: "+t+"/10\nSoft Skills: "+s+"/10\nAverage Rating: "+((+t + +s)/2).toFixed(1)+"/10";
}
</script>
</body>
</html>
